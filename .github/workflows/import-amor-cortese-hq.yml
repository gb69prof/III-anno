          ls -lh Letteratura/Lezioni/amor-cortese/assets/cover-interactive.png Letteratura/Lezioni/amor-cortese/assets/maps/*.png
      - name: Commit HQ images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gbprof automation'
          git config user.email 'gb69prof@users.noreply.github.com'
          git add -A Letteratura/Lezioni/amor-cortese/assets
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Replace Amor cortese images with high quality PNG versions'
            git push origin HEAD:amor-cortese-hq
          fi
