name: Import high quality Amor cortese images

on:
  push:
    branches: [ amor-cortese-hq ]
    paths:
      - '.github/workflows/import-amor-cortese-hq.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amor-cortese-hq
          fetch-depth: 0
      - name: Download HQ images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Letteratura/Lezioni/amor-cortese/assets/maps
