name: Import final Amor cortese images

on:
  push:
    branches: [ amor-cortese-final ]
    paths:
      - '.github/workflows/import-amor-cortese-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: amor-cortese-final
          fetch-depth: 0
      - name: Download final generated images
