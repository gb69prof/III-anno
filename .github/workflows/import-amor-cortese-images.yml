      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gbprof automation'
          git config user.email 'gb69prof@users.noreply.github.com'
          git add Letteratura/Lezioni/amor-cortese/assets/cover-interactive.jpg Letteratura/Lezioni/amor-cortese/assets/maps/*.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add final illustrated Amor cortese cover and maps'
            git push origin HEAD:amor-cortese-final
          fi
