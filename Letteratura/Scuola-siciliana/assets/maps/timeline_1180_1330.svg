<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="tt td"><title id="tt">Cronologia 1180–1330</title><desc id="td">La lirica trobadorica precede e accompagna la corte federiciana; l’attività dei Siciliani si concentra fra 1220 e 1266; le copie toscane e Dante trasformano la tradizione fino al primo Trecento.</desc>
