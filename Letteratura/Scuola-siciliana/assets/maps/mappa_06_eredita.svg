<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">06 · La conclusione</title><desc id="desc">La tradizione vive trasformando. Crisi sveva: disperde il centro. Canzonieri: conservano e ordinano. Copisti: adattano la lingua. Dante: costruisce una genealogia. Forme e lessico: vengono riusati. Canone italiano: esito pluricentrico</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#645d53"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b2733" flood-opacity=".16"/></filter></defs>
  <rect width="1600" height="980" fill="#f7f3ea"/><path d="M0 64H1600" stroke="#b27a27" stroke-width="12"/>
  <text class="heading" x="80" y="65">06 · La conclusione</text>
  <g><path d="M 800 220 C 800 282.5, 270 282.5, 270 342" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="449" y="265.5" width="172" height="34" rx="17"/><text x="535" y="289.5" text-anchor="middle">riceve</text></g><path d="M 800 220 C 800 282.5, 800 282.5, 800 342" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="714" y="265.5" width="172" height="34" rx="17"/><text x="800" y="289.5" text-anchor="middle">organizza</text></g><path d="M 800 220 C 800 282.5, 1330 282.5, 1330 342" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="979" y="265.5" width="172" height="34" rx="17"/><text x="1065" y="289.5" text-anchor="middle">trasforma</text></g><path d="M 270 460 C 270 577.5, 270 577.5, 270 692" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="184" y="560.5" width="172" height="34" rx="17"/><text x="270" y="584.5" text-anchor="middle">prepara</text></g><path d="M 800 460 C 800 577.5, 800 577.5, 800 692" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="714" y="560.5" width="172" height="34" rx="17"/><text x="800" y="584.5" text-anchor="middle">si traduce in</text></g><path d="M 1330 460 C 1330 577.5, 1330 577.5, 1330 692" fill="none" stroke="#645d53" stroke-width="4" marker-end="url(#arrow)"/>
  <g class="edge-label"><rect x="1244" y="560.5" width="172" height="34" rx="17"/><text x="1330" y="584.5" text-anchor="middle">confluisce in</text></g><g class="node"><rect x="490" y="105" width="620" height="110" rx="22" fill="#254f67" />
  <text x="800" y="160" text-anchor="middle"><tspan x="800" dy="0">La tradizione vive trasformando</tspan></text></g><g class="node"><rect x="60" y="350" width="420" height="105" rx="22" fill="#8a3f45" />
  <text x="270" y="385.5" text-anchor="middle"><tspan x="270" dy="0">Crisi sveva: disperde il</tspan><tspan x="270" dy="34">centro</tspan></text></g><g class="node"><rect x="590" y="350" width="420" height="105" rx="22" fill="#b27a27" />
  <text x="800" y="385.5" text-anchor="middle"><tspan x="800" dy="0">Canzonieri: conservano e</tspan><tspan x="800" dy="34">ordinano</tspan></text></g><g class="node"><rect x="1120" y="350" width="420" height="105" rx="22" fill="#35665c" />
  <text x="1330" y="385.5" text-anchor="middle"><tspan x="1330" dy="0">Copisti: adattano la</tspan><tspan x="1330" dy="34">lingua</tspan></text></g><g class="node"><rect x="60" y="700" width="420" height="105" rx="22" fill="#5f5574" />
  <text x="270" y="735.5" text-anchor="middle"><tspan x="270" dy="0">Dante: costruisce una</tspan><tspan x="270" dy="34">genealogia</tspan></text></g><g class="node"><rect x="590" y="700" width="420" height="105" rx="22" fill="#536b78" />
  <text x="800" y="735.5" text-anchor="middle"><tspan x="800" dy="0">Forme e lessico: vengono</tspan><tspan x="800" dy="34">riusati</tspan></text></g><g class="node"><rect x="1120" y="700" width="420" height="105" rx="22" fill="#254f67" />
  <text x="1330" y="735.5" text-anchor="middle"><tspan x="1330" dy="0">Canone italiano: esito</tspan><tspan x="1330" dy="34">pluricentrico</tspan></text></g></g>
  <text class="foot" x="800" y="925" text-anchor="middle">Le relazioni nominate sono ipotesi da verificare nei testi, non una successione inevitabile.</text>
