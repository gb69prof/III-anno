<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082c42">
  <meta name="description" content="PWA didattica sull'amor cortese: società feudale, Andrea Cappellano, trovatori, Bernart de Ventadorn, trovatrici e Beatritz de Dia.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amor cortese">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="visual-upgrade.css">
  <title>Amor cortese — Percorso didattico</title>
  <link rel="stylesheet" href="../../../pwa-common/gbprof-accessibility.css?v=1">
</head>
<body>
  <a class="skip-link" href="#app">Vai al contenuto</a>

  <header class="site-header" aria-label="Navigazione principale">
    <button class="brand" type="button" data-route="home" aria-label="Torna alla copertina">
      <span class="brand-mark" aria-hidden="true">AC</span>
      <span class="brand-copy">
        <strong>Amor cortese</strong>
        <small>Letteratura medievale</small>
      </span>
    </button>

    <nav class="main-nav" aria-label="Sezioni del percorso">
      <button type="button" data-route="home"><span aria-hidden="true">⌂</span> Percorso</button>
      <button type="button" data-route="sintesi"><span aria-hidden="true">≋</span> Sintesi</button>
      <button type="button" data-route="vocabolario"><span aria-hidden="true">A</span> Vocabolario</button>
      <button type="button" data-route="test"><span aria-hidden="true">✓</span> Test</button>
    </nav>

    <div class="header-tools">
      <div class="progress-pill" aria-live="polite">
        <span id="progressText">0/7</span>
        <span>lezioni</span>
      </div>
      <button id="installBtn" class="install-btn" type="button" hidden>Installa</button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="site-footer">
    <p><strong>gbprof · Libera</strong> — PWA didattica, 2026</p>
    <p>Contenuti delle lezioni forniti dal docente. Funziona anche offline dopo il primo caricamento.</p>
  </footer>

  <noscript>
    <div class="noscript">Questa PWA richiede JavaScript per la navigazione, le mappe concettuali e il test finale.</div>
  </noscript>

  <script src="app.js" defer></script>
  <script src="visual-upgrade.js" defer></script>
  <script src="../../../pwa-common/gbprof-accessibility.js?v=1"></script>
</body>
</html>
