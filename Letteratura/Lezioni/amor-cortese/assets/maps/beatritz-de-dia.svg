<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2000" role="img" aria-labelledby="mt md"><title id="mt">Mappa concettuale — Beatritz de Dia</title><desc id="md">IL DESIDERIO CAMBIA VOCE</desc><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2b1d11" flood-opacity=".28"/></filter><linearGradient id="parch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4e6c1"/><stop offset=".52" stop-color="#e4c792"/><stop offset="1" stop-color="#cfab70"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c532c"/></marker></defs><style>.head{font:bold 40px Georgia,serif;fill:#062b40}.body{font:28px Georgia,serif;fill:#2e241d}.banner{font:bold 22px Georgia,serif;fill:#062b40}.bottom{font:30px Georgia,serif;fill:#2e241d}</style><rect width="1400" height="2000" fill="#b99f85"/><rect x="25" y="25" width="1350" height="1950" fill="url(#parch)" stroke="#765638" stroke-width="5"/><rect x="45" y="45" width="1310" height="1910" fill="none" stroke="#062b40" stroke-width="3"/><g stroke="#765638" fill="none" stroke-width="3"><path d="M75 120q70-70 140 0q70-70 140 0M1045 120q70-70 140 0q70-70 140 0"/><path d="M75 1870q70 70 140 0q70 70 140 0M1045 1870q70 70 140 0q70 70 140 0"/></g><g filter="url(#shadow)"><path d="M190 85H1210L1165 250H235Z" fill="#dcc398" stroke="#765638" stroke-width="5"/><path d="M190 85l-95 70 105 35M1210 85l95 70-105 35" fill="#c7a979" stroke="#765638" stroke-width="5"/></g><text x="700" y="175" text-anchor="middle" class="head" font-size="50">BEATRITZ DE DIA</text><text x="700" y="230" text-anchor="middle" class="body" font-size="25" font-style="italic">IL DESIDERIO CAMBIA VOCE</text><g fill="none" stroke="#8c532c" stroke-width="5" marker-end="url(#arrow)" opacity=".85"><path d="M615 510Q665 560 650 665"/><path d="M785 510Q735 560 750 665"/><path d="M615 1170Q665 1120 650 1035"/><path d="M785 1170Q735 1120 750 1035"/></g><g filter="url(#shadow)"><path d="M115 340H595L615 388L595 436H115L95 388Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="355" y="402" text-anchor="middle" class="banner">1. ESPERIENZA</text><rect x="120" y="445" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="150" y="495" class="body"><tspan x="150">La poetessa parla di un amore</tspan><tspan x="150" dy="38">vissuto, ricordato e tradito, non</tspan><tspan x="150" dy="38">soltanto contemplato.</tspan></text><g filter="url(#shadow)"><path d="M805 340H1285L1305 388L1285 436H805L785 388Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="1045" y="402" text-anchor="middle" class="banner">2. CORPO</text><rect x="810" y="445" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="840" y="495" class="body"><tspan x="840">Vicinanza, contatto e desiderio</tspan><tspan x="840" dy="38">fisico emergono in modo diretto</tspan><tspan x="840" dy="38">nel discorso poetico.</tspan></text><g filter="url(#shadow)"><path d="M115 1020H595L615 1068L595 1116H115L95 1068Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="355" y="1082" text-anchor="middle" class="banner">3. SOGGETTO</text><rect x="120" y="1125" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="150" y="1175" class="body"><tspan x="150">La donna formula richieste e</tspan><tspan x="150" dy="38">condizioni: non attende soltanto</tspan><tspan x="150" dy="38">di essere scelta.</tspan></text><g filter="url(#shadow)"><path d="M805 1020H1285L1305 1068L1285 1116H805L785 1068Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="1045" y="1082" text-anchor="middle" class="banner">4. TENSIONE</text><rect x="810" y="1125" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="840" y="1175" class="body"><tspan x="840">Il linguaggio cortese resta, ma la</tspan><tspan x="840" dy="38">concretezza della relazione mette</tspan><tspan x="840" dy="38">alla prova il codice.</tspan></text><g filter="url(#shadow)"><rect x="475" y="650" width="450" height="460" rx="28" fill="#e7cf9e" stroke="#062b40" stroke-width="6"/><rect x="490" y="665" width="420" height="430" rx="22" fill="none" stroke="#c68a38" stroke-width="3"/></g><g transform="translate(700 900)" stroke="#2e241d" stroke-width="6" fill="none" stroke-linecap="round"><circle cy="-115" r="42" fill="#b77e4a"/><path d="M-90-65Q0-130 90-65L118 130H-118Z" fill="#6f4b3a"/><path d="M-58-142q58-55 116 0"/><path d="M-70 0L15 70L105-30" stroke="#8c532c"/><path d="M-170 150Q-75 85 0 150Q75 85 170 150"/><path d="M0 150v95"/></g><rect x="505" y="1050" width="390" height="76" rx="15" fill="#062b40"/><text x="700" y="1098" text-anchor="middle" font-family="Georgia" font-size="29" font-weight="bold" fill="#f2dfb8">IL DESIDERIO CAMBIA VOCE</text><g filter="url(#shadow)"><path d="M170 1410H1230L1190 1500H210Z" fill="#d0b27d" stroke="#765638" stroke-width="5"/><text x="700" y="1470" text-anchor="middle" class="head" font-size="38">NUCLEO DELLA LEZIONE</text><rect x="190" y="1535" width="1020" height="300" rx="18" fill="#f0dfba" stroke="#9a7650" stroke-width="4"/></g><text x="240" y="1605" class="bottom"><tspan x="240">In Beatritz de Dia il desiderio femminile entra nel centro</tspan><tspan x="240" dy="42">della scena. La donna non è più il premio distante del</tspan><tspan x="240" dy="42">servizio maschile: desidera, rivendica, immagina una relazione</tspan><tspan x="240" dy="42">concreta e rende visibile ciò che il codice tradizionale</tspan><tspan x="240" dy="42">tendeva a lasciare implicito.</tspan></text><path d="M260 1875H1140" stroke="#c68a38" stroke-width="3"/><text x="700" y="1925" text-anchor="middle" font-family="Georgia" font-size="22" letter-spacing="2" fill="#062b40">AMOR CORTESE · MAPPA CONCETTUALE</text></svg>