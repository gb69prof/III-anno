<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2000" role="img" aria-labelledby="mt md"><title id="mt">Mappa concettuale — I trovatori provenzali</title><desc id="md">LA PAROLA PRECEDE IL CODICE</desc><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2b1d11" flood-opacity=".28"/></filter><linearGradient id="parch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4e6c1"/><stop offset=".52" stop-color="#e4c792"/><stop offset="1" stop-color="#cfab70"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c532c"/></marker></defs><style>.head{font:bold 40px Georgia,serif;fill:#062b40}.body{font:28px Georgia,serif;fill:#2e241d}.banner{font:bold 22px Georgia,serif;fill:#062b40}.bottom{font:30px Georgia,serif;fill:#2e241d}</style><rect width="1400" height="2000" fill="#b99f85"/><rect x="25" y="25" width="1350" height="1950" fill="url(#parch)" stroke="#765638" stroke-width="5"/><rect x="45" y="45" width="1310" height="1910" fill="none" stroke="#062b40" stroke-width="3"/><g stroke="#765638" fill="none" stroke-width="3"><path d="M75 120q70-70 140 0q70-70 140 0M1045 120q70-70 140 0q70-70 140 0"/><path d="M75 1870q70 70 140 0q70 70 140 0M1045 1870q70 70 140 0q70 70 140 0"/></g><g filter="url(#shadow)"><path d="M190 85H1210L1165 250H235Z" fill="#dcc398" stroke="#765638" stroke-width="5"/><path d="M190 85l-95 70 105 35M1210 85l95 70-105 35" fill="#c7a979" stroke="#765638" stroke-width="5"/></g><text x="700" y="175" text-anchor="middle" class="head" font-size="50">I TROVATORI PROVENZALI</text><text x="700" y="230" text-anchor="middle" class="body" font-size="25" font-style="italic">LA PAROLA PRECEDE IL CODICE</text><g fill="none" stroke="#8c532c" stroke-width="5" marker-end="url(#arrow)" opacity=".85"><path d="M615 510Q665 560 650 665"/><path d="M785 510Q735 560 750 665"/><path d="M615 1170Q665 1120 650 1035"/><path d="M785 1170Q735 1120 750 1035"/></g><g filter="url(#shadow)"><path d="M115 340H595L615 388L595 436H115L95 388Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="355" y="402" text-anchor="middle" class="banner">1. LINGUA D’OC</text><rect x="120" y="445" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="150" y="495" class="body"><tspan x="150">Una lingua raffinata e musicale</tspan><tspan x="150" dy="38">rende l’amore materia di forma,</tspan><tspan x="150" dy="38">ritmo e sfumatura.</tspan></text><g filter="url(#shadow)"><path d="M805 340H1285L1305 388L1285 436H805L785 388Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="1045" y="402" text-anchor="middle" class="banner">2. SERVIZIO</text><rect x="810" y="445" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="840" y="495" class="body"><tspan x="840">Il poeta-cavaliere adotta il</tspan><tspan x="840" dy="38">lessico feudale di fedeltà,</tspan><tspan x="840" dy="38">obbedienza e merito.</tspan></text><g filter="url(#shadow)"><path d="M115 1020H595L615 1068L595 1116H115L95 1068Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="355" y="1082" text-anchor="middle" class="banner">3. MISURA</text><rect x="120" y="1125" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="150" y="1175" class="body"><tspan x="150">Il desiderio resta sensuale ma</tspan><tspan x="150" dy="38">viene disciplinato dalla distanza</tspan><tspan x="150" dy="38">e dalla forma poetica.</tspan></text><g filter="url(#shadow)"><path d="M805 1020H1285L1305 1068L1285 1116H805L785 1068Z" fill="#d8bd8b" stroke="#765638" stroke-width="4"/><text x="1045" y="1082" text-anchor="middle" class="banner">4. GRAMMATICA</text><rect x="810" y="1125" width="470" height="205" rx="12" fill="#efdfbc" stroke="#94704d" stroke-width="3"/></g><text x="840" y="1175" class="body"><tspan x="840">Prima della teoria esiste già un</tspan><tspan x="840" dy="38">repertorio condiviso di gesti,</tspan><tspan x="840" dy="38">formule e immagini.</tspan></text><g filter="url(#shadow)"><rect x="475" y="650" width="450" height="460" rx="28" fill="#e7cf9e" stroke="#062b40" stroke-width="6"/><rect x="490" y="665" width="420" height="430" rx="22" fill="none" stroke="#c68a38" stroke-width="3"/></g><g transform="translate(700 900)" stroke="#2e241d" stroke-width="6" fill="none" stroke-linecap="round"><circle cx="-70" cy="-115" r="38" fill="#b77e4a"/><path d="M-135-60Q-70-120-5-60L20 140H-160Z" fill="#46545b"/><ellipse cx="65" cy="25" rx="72" ry="95" fill="#b47737" transform="rotate(-18 65 25)"/><circle cx="68" cy="28" r="22"/><path d="M110-30l150-145M232-150l44-20"/><path d="M-55-22L125 85M-20-58L137 57"/></g><rect x="505" y="1050" width="390" height="76" rx="15" fill="#062b40"/><text x="700" y="1098" text-anchor="middle" font-family="Georgia" font-size="29" font-weight="bold" fill="#f2dfb8">LA PAROLA PRECEDE IL CODICE</text><g filter="url(#shadow)"><path d="M170 1410H1230L1190 1500H210Z" fill="#d0b27d" stroke="#765638" stroke-width="5"/><text x="700" y="1470" text-anchor="middle" class="head" font-size="38">NUCLEO DELLA LEZIONE</text><rect x="190" y="1535" width="1020" height="300" rx="18" fill="#f0dfba" stroke="#9a7650" stroke-width="4"/></g><text x="240" y="1605" class="bottom"><tspan x="240">I trovatori non spiegano anzitutto l’amore: lo fanno esistere</tspan><tspan x="240" dy="42">nella lingua. La poesia crea uno spazio simbolico nel quale</tspan><tspan x="240" dy="42">desiderio, distanza e servizio possono essere vissuti e</tspan><tspan x="240" dy="42">riconosciuti prima ancora che Andrea Cappellano li trasformi</tspan><tspan x="240" dy="42">in codice.</tspan></text><path d="M260 1875H1140" stroke="#c68a38" stroke-width="3"/><text x="700" y="1925" text-anchor="middle" font-family="Georgia" font-size="22" letter-spacing="2" fill="#062b40">AMOR CORTESE · MAPPA CONCETTUALE</text></svg>