<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">La macchina poetica</title>
<desc id="desc">Tre alessandrini preparano la battuta; Due endecasillabi chiudono il motto; AAABB ordina il ritmo; Riprese collegano le strofe; Registri misti mettono in crisi alto e basso; Gesti e oggetti producono teatro mentale</desc>
