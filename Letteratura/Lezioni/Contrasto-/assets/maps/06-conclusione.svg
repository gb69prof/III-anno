<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">L’amore allo specchio</title>
<desc id="desc">Codice cortese nasconde corpo e potere; Borgo espone condizioni sociali; Filologia distingue certo e ipotetico; Duello trasforma amore in negoziazione; Metro rende precisa la comicità; Finale affida al lettore responsabilità</desc>
