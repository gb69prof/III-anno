<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Il codice cortese</title>
<desc id="desc">Fin’amor organizza servizio e distanza; Donna-signora richiede fedeltà dell’amante; Scuola siciliana trasforma eredità occitanica; Volgare illustre seleziona lingua poetica; Contrasto riprende formule alte; Ambiguità apre la frattura</desc>
