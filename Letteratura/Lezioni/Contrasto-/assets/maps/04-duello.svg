<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Il duello</title>
<desc id="desc">Lode incontra rifiuto; Parenti oppongono protezione imperiale; Vanterie generano condizioni; Rosa e frutto rendono visibile desiderio; Vangelo aggira rinvio; Resa conserva ambiguità</desc>
