<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lezione 9 · Eredità: che cosa resta dell&#x27;amor cortese?</title>
  <desc id="desc">La tradizione continua attraverso trasformazioni e Petrarca riapre il conflitto nella memoria. Il sentimento viene interpretato da parole e modelli; il consenso orienta l&#x27;azione, che produce conseguenze. La responsabilità distingue impulso, racconto e scelta senza separarli completamente.</desc>
