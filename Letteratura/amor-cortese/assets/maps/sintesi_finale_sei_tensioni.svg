  <text x="80" y="78" class="eyebrow" font-size="22" fill="#B06B2C">MAPPA DI SINTESI</text>
<text x="80" y="132" text-anchor="start" font-size="38" font-weight="800" fill="#1B2733"><tspan x="80" dy="0">Sei tensioni, nessuna formula</tspan></text>
