<text x="390" y="378" text-anchor="middle" font-size="25" font-weight="800" fill="#66507C">AZIONE</text>
<circle cx="800" cy="505" r="145" fill="#1B2733"/>
<text x="800" y="497" text-anchor="middle" font-size="27" font-weight="800" fill="#FFFFFF">RESPONSABILITÀ</text>
<text x="800" y="537" text-anchor="middle" font-size="20" font-weight="500" fill="#FFFFFF">distingue senza separare</text>
