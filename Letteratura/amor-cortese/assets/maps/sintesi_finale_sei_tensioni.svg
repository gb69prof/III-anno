<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sintesi finale · sei tensioni dell&#x27;amor cortese</title>
  <desc id="desc">Una rete collega desiderio, parola, società, consenso, azione e responsabilità. La responsabilità non cancella l&#x27;impulso, ma distingue il sentimento dal racconto e la scelta dalle conseguenze.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B2733" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315D7A"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .eyebrow { letter-spacing: 2.4px; font-weight: 700; }
    </style>
  </defs>
