<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rete dei significati medievali della rosa</title><desc id="desc">La rosa materiale offre proprietà selezionate diversamente dalla medicina, dalla Bibbia, dalla devozione, dalla corte, dall'allegoria e da Dante.</desc>
  <defs><style>.bg{fill:#f7f0e2}.line{fill:none;stroke:#b28a3e;stroke-width:4}.node{fill:#fffaf0;stroke:#d4c1a6;stroke-width:2}.core{fill:#7a1f2c}.h{font:700 27px Georgia,serif;fill:#7a1f2c}.t{font:600 18px system-ui,sans-serif;fill:#342621}.white{fill:#fff;font:700 32px Georgia,serif}.small{font:500 16px system-ui,sans-serif;fill:#6f6258}</style></defs>
  <rect class="bg" width="1200" height="760" rx="32"/>
  <path class="line" d="M600 380C430 310 340 180 250 125M600 380C430 380 330 380 210 380M600 380C430 470 360 590 260 650M600 380C770 310 860 180 950 125M600 380C770 380 870 380 990 380M600 380C770 470 840 590 940 650"/>
  <circle class="core" cx="600" cy="380" r="126"/><text class="white" x="600" y="367" text-anchor="middle">ROSA</text><text x="600" y="402" text-anchor="middle" style="fill:#f1d399;font:600 19px system-ui,sans-serif">materia + contesto</text>
  <g transform="translate(70 55)"><rect class="node" width="360" height="145" rx="20"/><text class="h" x="24" y="42">Corpo e cura</text><text class="t" x="24" y="76">petali · acqua · profumo</text><text class="small" x="24" y="108">ricette, giardini, materia medica</text></g>
  <g transform="translate(35 308)"><rect class="node" width="365" height="145" rx="20"/><text class="h" x="24" y="42">Scrittura</text><text class="t" x="24" y="76">fiore · giglio · giardino</text><text class="small" x="24" y="108">caducità, esegesi, hortus</text></g>
  <g transform="translate(80 575)"><rect class="node" width="360" height="135" rx="20"/><text class="h" x="24" y="42">Devozione</text><text class="t" x="24" y="76">Maria · purezza · lode</text><text class="small" x="24" y="106">liturgia, preghiera, immagini</text></g>
  <g transform="translate(770 55)"><rect class="node" width="360" height="145" rx="20"/><text class="h" x="24" y="42">Corte</text><text class="t" x="24" y="76">primavera · pregio · desiderio</text><text class="small" x="24" y="108">lirica e performance</text></g>
  <g transform="translate(800 308)"><rect class="node" width="365" height="145" rx="20"/><text class="h" x="24" y="42">Allegoria</text><text class="t" x="24" y="76">meta erotica · disputa</text><text class="small" x="24" y="108">Roman de la Rose e Fiore</text></g>
  <g transform="translate(760 575)"><rect class="node" width="360" height="135" rx="20"/><text class="h" x="24" y="42">Visione</text><text class="t" x="24" y="76">luce · ordine · comunità</text><text class="small" x="24" y="106">la candida rosa di Dante</text></g>
</svg>
