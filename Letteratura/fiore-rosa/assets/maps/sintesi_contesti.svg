<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Metodo per leggere la rosa nei contesti medievali</title><desc id="desc">Una sequenza di domande collega oggetto, fonte, voce, funzione, pubblico e grado di certezza, con quattro grandi famiglie di contesti.</desc>
  <defs><style>.bg{fill:#f7f0e2}.band{fill:#7a1f2c}.box{fill:#fffaf0;stroke:#d4c1a6;stroke-width:2}.b1{fill:#e7eee3}.b2{fill:#e5ecf3}.b3{fill:#f3e4df}.b4{fill:#efe5cb}.h{font:700 28px Georgia,serif;fill:#6d1824}.t{font:600 18px system-ui,sans-serif;fill:#342621}.q{font:700 18px system-ui,sans-serif;fill:#fff}.num{font:800 29px Georgia,serif;fill:#b28a3e}.arrow{stroke:#b28a3e;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b28a3e"/></marker></defs>
  <rect class="bg" width="1200" height="760" rx="32"/><rect class="band" x="55" y="45" width="1090" height="100" rx="22"/><text class="q" x="600" y="87" text-anchor="middle">UNA ROSA NON SI INTERPRETA DA SOLA</text><text x="600" y="120" text-anchor="middle" style="fill:#f2d59a;font:600 18px system-ui,sans-serif">segui la catena delle domande</text>
  <g transform="translate(55 200)"><rect class="box" width="170" height="125" rx="18"/><text class="num" x="20" y="40">1</text><text class="h" x="20" y="75">Oggetto</text><text class="t" x="20" y="105">Che cosa c'è?</text></g><path class="arrow" d="M230 263H268"/>
  <g transform="translate(275 200)"><rect class="box" width="170" height="125" rx="18"/><text class="num" x="20" y="40">2</text><text class="h" x="20" y="75">Fonte</text><text class="t" x="20" y="105">Dove e quando?</text></g><path class="arrow" d="M450 263H488"/>
  <g transform="translate(495 200)"><rect class="box" width="170" height="125" rx="18"/><text class="num" x="20" y="40">3</text><text class="h" x="20" y="75">Voce</text><text class="t" x="20" y="105">Chi parla?</text></g><path class="arrow" d="M670 263H708"/>
  <g transform="translate(715 200)"><rect class="box" width="190" height="125" rx="18"/><text class="num" x="20" y="40">4</text><text class="h" x="20" y="75">Funzione</text><text class="t" x="20" y="105">Che cosa fa?</text></g><path class="arrow" d="M910 263H948"/>
  <g transform="translate(955 200)"><rect class="box" width="190" height="125" rx="18"/><text class="num" x="20" y="40">5</text><text class="h" x="20" y="75">Certezza</text><text class="t" x="20" y="105">Quanto regge?</text></g>
  <g transform="translate(55 390)"><rect class="b1" width="250" height="250" rx="22"/><text class="h" x="24" y="48">Materia</text><text class="t" x="24" y="88">cura e profumo</text><text class="t" x="24" y="124">giardino e stagioni</text><text class="t" x="24" y="160">proprietà sensibili</text><text x="24" y="212" style="font:700 16px system-ui;fill:#405f43">PRIMA DEL SIMBOLO</text></g>
  <g transform="translate(335 390)"><rect class="b2" width="250" height="250" rx="22"/><text class="h" x="24" y="48">Scrittura</text><text class="t" x="24" y="88">Bibbia ed esegesi</text><text class="t" x="24" y="124">Maria e devozione</text><text class="t" x="24" y="160">testo + tradizione</text><text x="24" y="212" style="font:700 16px system-ui;fill:#284f78">SVILUPPO STORICO</text></g>
  <g transform="translate(615 390)"><rect class="b3" width="250" height="250" rx="22"/><text class="h" x="24" y="48">Corte</text><text class="t" x="24" y="88">lirica e contrasto</text><text class="t" x="24" y="124">desiderio e comicità</text><text class="t" x="24" y="160">forma ≠ vita reale</text><text x="24" y="212" style="font:700 16px system-ui;fill:#8b302e">MEDIAZIONE</text></g>
  <g transform="translate(895 390)"><rect class="b4" width="250" height="250" rx="22"/><text class="h" x="24" y="48">Allegoria</text><text class="t" x="24" y="88">Roman e Fiore</text><text class="t" x="24" y="124">Dante e la comunità</text><text class="t" x="24" y="160">somiglianze + scarti</text><text x="24" y="212" style="font:700 16px system-ui;fill:#76591e">CONFRONTO</text></g>
  <text x="600" y="710" text-anchor="middle" style="font:700 22px Georgia,serif;fill:#6d1824">Pluralità non significa arbitrarietà: ogni lettura risponde alle fonti.</text>
</svg>
