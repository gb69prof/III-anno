<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="t d">
<title id="t">Rinascimento — forma e crisi</title>
<desc id="d">Copertina astratta: una città rinascimentale ordinata dalla prospettiva è attraversata da una frattura che allude alle guerre d'Italia e alla crisi del Cinquecento.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e8dcc4"/>
    <stop offset=".52" stop-color="#b7c3bd"/>
    <stop offset="1" stop-color="#1e272b"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c7aa7e"/>
    <stop offset="1" stop-color="#45362d"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#f4d58c"/>
    <stop offset="1" stop-color="#c49343"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>

<rect width="1000" height="1000" fill="url(#bg)"/>
<rect x="500" width="500" height="1000" fill="#17191b" opacity=".42"/>

<!-- ordine geometrico -->
<circle cx="350" cy="275" r="205" fill="none" stroke="#fff3d5" stroke-width="5" opacity=".72"/>
<rect x="205" y="130" width="290" height="290" fill="none" stroke="#fff3d5" stroke-width="5" opacity=".72"/>
<circle cx="350" cy="275" r="54" fill="url(#sun)" opacity=".95"/>
<g stroke="#fff3d5" stroke-width="2.5" opacity=".42">
  <path d="M145 275h410"/>
  <path d="M350 70v410"/>
  <path d="M205 130l290 290"/>
  <path d="M495 130L205 420"/>
</g>

<!-- grande arco -->
<path d="M115 690V335Q115 110 340 110h320q225 0 225 225v355" fill="none" stroke="#e8d3ad" stroke-width="34" opacity=".9"/>
<path d="M145 690V345Q145 140 350 140h300q205 0 205 205v345" fill="none" stroke="#6a5949" stroke-width="4" opacity=".65"/>

<!-- prospettiva -->
<path d="M70 955L500 555l430 400Z" fill="url(#floor)" opacity=".94"/>
<g stroke="#ead3aa" stroke-width="2.5" opacity=".45">
  <path d="M500 555v400"/>
  <path d="M70 955l430-400 430 400"/>
  <path d="M190 955l310-400 310 400"/>
  <path d="M310 955l190-400 190 400"/>
  <path d="M430 955l70-400 70 400"/>
  <path d="M130 890h740"/>
  <path d="M205 820h590"/>
  <path d="M280 750h440"/>
  <path d="M350 680h300"/>
  <path d="M420 610h160"/>
</g>

<!-- skyline fiorentino stilizzato -->
<g fill="#29363b" opacity=".9">
  <rect x="170" y="545" width="85" height="150"/>
  <rect x="276" y="500" width="48" height="195"/>
  <rect x="690" y="535" width="92" height="160"/>
  <rect x="800" y="570" width="55" height="125"/>
</g>
<g fill="#8b4b35">
  <path d="M365 575q40-100 80 0v120h-80z"/>
  <path d="M365 575q40-145 80 0z" fill="#b65d3d"/>
  <rect x="392" y="435" width="26" height="140"/>
</g>

<!-- la frattura -->
<path d="M558 -30 L510 165 L552 292 L500 415 L554 530 L486 650 L535 770 L470 1040"
      fill="none" stroke="#802f29" stroke-width="28" opacity=".92"/>
<path d="M558 -30 L510 165 L552 292 L500 415 L554 530 L486 650 L535 770 L470 1040"
      fill="none" stroke="#d37555" stroke-width="5" opacity=".92"/>

<!-- ombre della crisi -->
<ellipse cx="755" cy="385" rx="170" ry="130" fill="#7b2d29" opacity=".15" filter="url(#soft)"/>
<g fill="#f0d49b" font-family="Georgia,serif">
  <text x="80" y="90" font-size="28" letter-spacing="10">MISURA</text>
  <text x="650" y="90" font-size="28" letter-spacing="10" fill="#e7c4a2">CRISI</text>
</g>
<g fill="#f4e6c8" font-family="Georgia,serif" text-anchor="middle">
  <text x="500" y="905" font-size="31" letter-spacing="9">FORMA · POTERE · FORTUNA</text>
  <text x="500" y="944" font-size="17" letter-spacing="5" opacity=".78">ITALIA · CINQUECENTO</text>
</g>
</svg>