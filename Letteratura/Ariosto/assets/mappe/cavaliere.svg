<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Approfondimento · Il cavaliere</title>
<desc id="desc">Confrontare le figure del cavaliere non significa raccontare un passaggio da un Medioevo privo di dubbi a una modernità tutta incerta. Nell’epica e nel romanzo medievale Roland, Lancillotto e Tristano mostrano già conflitti fra fedeltà, orgoglio e amore. Nel Furioso Orlando, Ruggiero e Bradamante espongono la fragilità dell’eroe attraverso desideri, scelte e limiti della ragione. Il confronto con Tasso mostra invece la tensione fra missione cristiana e passioni nella Liberata. Nel Don Chisciotte di Cervantes, pubblicato nel 1605 e nel 1615, il confronto fra libri e realtà rivela un ideale fuori tempo, intrecciando comicità, sofferenza e ricerca di giustizia.</desc>
