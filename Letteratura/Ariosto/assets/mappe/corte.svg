<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Approfondimento · Scrittore di corte</title>
<desc id="desc">Ariosto vive una tensione fra protezione, servizio e libertà di giudizio. Il mecenatismo ha precedenti medievali e sostiene lo scrittore, ma richiede incarichi e missioni: Ariosto serve Ippolito dal 1503 e Alfonso dal 1518. Nel Furioso celebra gli Este attraverso il mito genealogico di Ruggiero e Bradamante, ma osserva anche la vanità del potere: sulla Luna compaiono adulazioni e favori perduti. Nelle Satire difende la propria misura; il rifiuto dell’Ungheria nel 1517 esprime la ricerca di spazio per legami e scrittura. La critica alla dipendenza nasce dall’interno della corte.</desc>
