<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Le fratture biografiche</title>
<desc id="desc">Ariosto vive dal 1474 al 1533, fra Reggio Emilia e Ferrara. Dal 1503 presta servizio al cardinale Ippolito d’Este: nel 1517 rifiuta di seguirlo in Ungheria per difendere legami, salute e tempo per scrivere. Dal 1518 serve Alfonso d’Este, che gli affida il governo della Garfagnana nel 1522–1525. Rivede il Furioso nelle edizioni del 1516, 1521 e 1532: nella terza amplia il poema fino a 46 canti e ne rielabora la lingua.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#b5824a"/></marker></defs>
<rect width="1200" height="960" fill="#f5f1e7"/>
<rect width="1200" height="8" fill="#b5824a"/>
