<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Le opere</title>
<desc id="desc">La scrittura di Ariosto si esprime nel poema, nelle satire e nel teatro. Il Furioso intreccia amore, guerra e mito genealogico estense, mettendo in tensione ideali e passioni: Angelica sceglie e Orlando perde il senno. Le sette Satire discutono lavoro, desideri e autonomia, elaborando una misura personale che difende tempo, legami e libertà di giudizio. Le commedie, fra cui Cassaria del 1508 e Suppositi del 1509, portano in scena interessi e inganni attraverso modelli classici per il pubblico di corte.</desc>
