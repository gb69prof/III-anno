<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Il mondo precedente</title>
<desc id="desc">Ariosto eredita una tradizione cavalleresca che comprende già fedeltà, amore, orgoglio e contraddizioni. Continua il poema di Boiardo, con Angelica, Orlando innamorato e molte storie intrecciate, e sviluppa nel Furioso desideri molteplici e distanza ironica. Lavora nella corte estense: il mecenatismo sostiene la scrittura ma impone vincoli, creando una tensione fra sostegno e autonomia.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#b5824a"/></marker></defs>
