<rect width="1200" height="8" fill="#b5824a"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" fill="#173c3b">Il mondo precedente</text>
<text x="600" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#51645d">Una tradizione cavalleresca dentro la corte rinascimentale</text>
