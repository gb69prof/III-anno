<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">La poetica</title>
<desc id="desc">Ariosto ordina con la scrittura una materia mobile e varia. L’intreccio, o entrelacement, interrompe e riprende i fili narrativi, producendo attesa e confronti fra vicende. L’ottava di otto endecasillabi, con schema ABABABCC, organizza ritmo e svolte: il distico finale può chiudere o cambiare il tono. Commenti, apostrofi e ironia della voce narrante richiedono una lettura critica che distingua eventi, giudizi e interpretazioni.</desc>
