<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1280" role="img" aria-labelledby="t d"><title id="t">Jacopo da Lentini: Dio, la donna e il paradiso</title><desc id="d">Dio, donna e paradiso si apre con Quartina I: servire Dio. Quartina I: servire Dio entra in tensione con Quartina II: senza donna, niente gioia. Quartina II: senza donna, niente gioia viene precisata nella Terzina I: «Ma» → esclude il peccato. Terzina I: «Ma» → esclude il peccato si sviluppa nella Terzina II: contemplazione e gloria. Terzina II: contemplazione e gloria conserva la Bellezza sensibile ancora presente. Bellezza sensibile ancora presente non dimostra una guida salvifica: Mediazione proposta, domanda aperta.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1280" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="100" y="80" width="620" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="139.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Dio, donna e paradiso</text><path d="M410 185 L410 245" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="202" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si apre con</text><rect x="100" y="245" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="304.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Quartina I: servire Dio</text><path d="M410 350 L410 410" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="367" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">entra in tensione con</text><rect x="100" y="410" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="469.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Quartina II: senza donna, niente gioia</text><path d="M410 515 L410 575" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="532" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">viene precisata nella</text><rect x="100" y="575" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="634.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Terzina I: «Ma» → esclude il peccato</text><path d="M410 680 L410 740" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="697" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si sviluppa nella</text><rect x="100" y="740" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="799.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Terzina II: contemplazione e gloria</text><path d="M410 845 L410 905" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="862" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="881" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">conserva la</text><rect x="100" y="905" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="964.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Bellezza sensibile ancora presente</text><path d="M410 1010 L410 1070" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="1027" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="1046" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">non dimostra una guida salvifica:</text><rect x="100" y="1070" width="620" height="105" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="410.0" y="1129.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Mediazione proposta, domanda aperta</text><text x="410" y="1256" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text></svg>