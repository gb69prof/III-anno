<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1080" role="img" aria-labelledby="t d"><title id="t">La nascita dell’amor cortese</title><desc id="d">La lirica occitanica nasce nelle reti di corti. Si può leggere attraverso il servizio e la gerarchia, le aspirazioni di prestigio, gli effetti della distanza sul desiderio. Queste tre chiavi sono ipotesi da verificare sugli indizi testuali, non leggi sulle biografie degli amanti.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1080" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="120" y="80" width="580" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="139.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Reti di corti e lirica occitanica</text><path d="M410 185 L150 300" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="252" width="250" height="27" rx="9" fill="#f3eddf"/><text x="150" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si legge anche con</text><rect x="35" y="300" width="230" height="100" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="150.0" y="357.0" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="19">Chiave politica</text><path d="M150 400 L150 465" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25.0" y="422" width="250" height="27" rx="9" fill="#f3eddf"/><text x="150.0" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">osserva</text><rect x="35" y="465" width="230" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="150.0" y="510.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Servizio e</text><text x="150.0" y="538.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">gerarchia</text><path d="M150 570 L410 730" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M410 185 L410 300" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285" y="252" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si legge anche con</text><rect x="295" y="300" width="230" height="100" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="410.0" y="357.0" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="19">Chiave sociale</text><path d="M410 400 L410 465" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="422" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">osserva</text><rect x="295" y="465" width="230" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="510.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Qualità e</text><text x="410.0" y="538.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">riconoscimento</text><path d="M410 570 L410 730" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M410 185 L670 300" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="545" y="252" width="250" height="27" rx="9" fill="#f3eddf"/><text x="670" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si legge anche con</text><rect x="555" y="300" width="230" height="100" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="670.0" y="357.0" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="19">Chiave psicologica</text><path d="M670 400 L670 465" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="545.0" y="422" width="250" height="27" rx="9" fill="#f3eddf"/><text x="670.0" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">osserva</text><rect x="555" y="465" width="230" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="670.0" y="510.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Distanza e</text><text x="670.0" y="538.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">idealizzazione</text><path d="M670 570 L410 730" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="120" y="730" width="580" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="789.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Indizi del testo → ipotesi verificabili</text><path d="M410 835 L410 910" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="859.5" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="878.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">impediscono</text><rect x="120" y="910" width="580" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="969.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Una sola causa o una biografia inventata</text><text x="410" y="1056" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text><rect x="30" y="637" width="240" height="27" rx="9" fill="#f3eddf"/><text x="150" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">concorrono al confronto</text><rect x="290" y="637" width="240" height="27" rx="9" fill="#f3eddf"/><text x="410" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">concorrono al confronto</text><rect x="550" y="637" width="240" height="27" rx="9" fill="#f3eddf"/><text x="670" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">concorrono al confronto</text></svg>