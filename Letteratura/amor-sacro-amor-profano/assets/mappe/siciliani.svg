<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1280" role="img" aria-labelledby="t d"><title id="t">La Scuola siciliana</title><desc id="d">La poesia alla corte federiciana prende forma in Corte mobile, autori di vari territori. Corte mobile, autori di vari territori rielabora Modelli occitanici selezionati. Modelli occitanici selezionati si esprimono nel Siciliano illustre: lingua letteraria. Siciliano illustre: lingua letteraria sperimenta anche il Sonetto: 14 endecasillabi. Sonetto: 14 endecasillabi è tramandato attraverso Copie toscane e rime siciliane. Copie toscane e rime siciliane rendono leggibile il testo di Jacopo: l’amata nel paradiso.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1280" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="100" y="80" width="620" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="139.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">La poesia alla corte federiciana</text><path d="M410 185 L410 245" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="202" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">prende forma in</text><rect x="100" y="245" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="304.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Corte mobile, autori di vari territori</text><path d="M410 350 L410 410" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="367" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">rielabora</text><rect x="100" y="410" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="469.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Modelli occitanici selezionati</text><path d="M410 515 L410 575" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="532" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si esprimono nel</text><rect x="100" y="575" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="634.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Siciliano illustre: lingua letteraria</text><path d="M410 680 L410 740" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="697" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">sperimenta anche il</text><rect x="100" y="740" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="799.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Sonetto: 14 endecasillabi</text><path d="M410 845 L410 905" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="862" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="881" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">è tramandato attraverso</text><rect x="100" y="905" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="964.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Copie toscane e rime siciliane</text><path d="M410 1010 L410 1070" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="1027" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="1046" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">rendono leggibile il testo di</text><rect x="100" y="1070" width="620" height="105" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="410.0" y="1129.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Jacopo: l’amata nel paradiso</text><text x="410" y="1256" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text></svg>