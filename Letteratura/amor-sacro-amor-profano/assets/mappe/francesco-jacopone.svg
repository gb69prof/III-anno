<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1080" role="img" aria-labelledby="t d"><title id="t">Due modi di vivere il cristianesimo</title><desc id="d">Francesco e Jacopone condividono la tradizione cristiana. Il Cantico collega creature, fraternità e lode anche nel dolore; la lauda studiata accumula malattie e iperboli per esprimere contrizione e conversione. Sono accenti testuali diversi, non due religioni opposte.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1080" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="170" y="80" width="480" height="100" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="137.0" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Tradizione cristiana condivisa</text><path d="M410 180 L205 380" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="95" y="277" width="250" height="27" rx="9" fill="#f3eddf"/><text x="220" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si esprime come</text><path d="M410 180 L615 380" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="475" y="277" width="250" height="27" rx="9" fill="#f3eddf"/><text x="600" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si esprime come</text><rect x="50" y="380" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="205.0" y="425.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Francesco: creature</text><text x="205.0" y="453.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">sorelle</text><rect x="50" y="540" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="205.0" y="585.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Fraternità, gratitudine e</text><text x="205.0" y="613.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">lode</text><path d="M205 485 L205 540" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="80.0" y="497" width="250" height="27" rx="9" fill="#f3eddf"/><text x="205.0" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">costruisce</text><rect x="50" y="700" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="205.0" y="745.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Gioia che attraversa la</text><text x="205.0" y="773.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">prova</text><path d="M205 645 L205 700" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="80.0" y="657" width="250" height="27" rx="9" fill="#f3eddf"/><text x="205.0" y="676" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">comprende</text><rect x="460" y="380" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="615.0" y="425.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Jacopone: malattie e</text><text x="615.0" y="453.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">abbandono</text><rect x="460" y="540" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="615.0" y="585.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Iperbole del peccato e</text><text x="615.0" y="613.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">della pena</text><path d="M615 485 L615 540" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="490.0" y="497" width="250" height="27" rx="9" fill="#f3eddf"/><text x="615.0" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">rende visibile</text><rect x="460" y="700" width="310" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="615.0" y="759.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Contrizione e conversione</text><path d="M615 645 L615 700" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="490.0" y="657" width="250" height="27" rx="9" fill="#f3eddf"/><text x="615.0" y="676" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">cerca</text><path d="M205 805 L410 900" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M615 805 L410 900" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="120" y="900" width="580" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="945.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Due testi diversi: la fede non si riduce a</text><text x="410.0" y="973.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">una sola voce</text><text x="410" y="1056" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text><rect x="85" y="837" width="240" height="27" rx="9" fill="#f3eddf"/><text x="205" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">mostrano</text><rect x="495" y="837" width="240" height="27" rx="9" fill="#f3eddf"/><text x="615" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">mostrano</text></svg>