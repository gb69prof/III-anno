<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1080" role="img" aria-labelledby="t d"><title id="t">Il problema rimane aperto</title><desc id="d">L’eredità cortese e siciliana viene rielaborata negli ambienti comunali. Guinizzelli lega amore e cuore gentile; Dante costruisce Beatrice come guida; Cavalcanti rappresenta la crisi dell’amante. Le domande condivise producono risposte divergenti.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1080" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="120" y="80" width="580" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="139.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Eredità cortese e siciliana</text><path d="M410 185 L410 270" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="214.5" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="233.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si trasforma negli</text><rect x="120" y="270" width="580" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="329.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Ambienti comunali: valore dell’individuo</text><path d="M410 375 L150 505" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="447" width="250" height="27" rx="9" fill="#f3eddf"/><text x="150" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">viene ripensata da</text><rect x="35" y="505" width="230" height="85" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="150.0" y="554.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Guinizzelli</text><path d="M150 590 L150 655" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25.0" y="612" width="250" height="27" rx="9" fill="#f3eddf"/><text x="150.0" y="631" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">indaga</text><rect x="35" y="655" width="230" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="150.0" y="700.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Amore e cuore</text><text x="150.0" y="728.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">gentile</text><path d="M150 760 L410 900" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M410 375 L410 505" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285" y="447" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">viene ripensata da</text><rect x="295" y="505" width="230" height="85" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="410.0" y="554.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Dante</text><path d="M410 590 L410 655" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="612" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="631" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">indaga</text><rect x="295" y="655" width="230" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="700.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">Beatrice guida</text><text x="410.0" y="728.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="20">verso Dio</text><path d="M410 760 L410 900" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M410 375