<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1160" role="img" aria-labelledby="t d"><title id="t">Mappa generale del percorso</title><desc id="d">Il Medioevo cristiano ripensa l’eredità classica. La poesia religiosa e la lirica cortese sono tradizioni contemporanee e comunicanti. I Siciliani rielaborano la lirica occitanica; Jacopo mette in tensione Dio e donna. Gli autori stilnovistici offrono esiti diversi.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1160" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="170" y="80" width="480" height="95" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="134.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Un mondo cristiano, eredità plurali</text><path d="M410 175 L410 250" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="199.5" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="218.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">rilegge</text><rect x="170" y="250" width="480" height="85" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="285.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">I classici: continuità e</text><text x="410.0" y="313.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">trasformazione</text><path d="M410 335 L205 435" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="80" y="377" width="250" height="27" rx="9" fill="#f3eddf"/><text x="205" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si intreccia con</text><path d="M410 335 L615 435" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="490" y="377" width="250" height="27" rx="9" fill="#f3eddf"/><text x="615" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si intreccia con</text><rect x="45" y="435" width="320" height="105" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="205.0" y="480.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Poesia religiosa:</text><text x="205.0" y="508.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Francesco e Jacopone</text><rect x="455" y="435" width="320" height="105" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="615.0" y="480.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Lirica cortese: servizio</text><text x="615.0" y="508.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">e desiderio</text><path d="M615 540 L615 620" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="490.0" y="567" width="250" height="27" rx="9" fill="#f3eddf"/><text x="615.0" y="586" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">viene rielaborata da</text><rect x="455" y="620" width="320" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="615.0" y="665.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Scuola siciliana: lingua</text><text x="615.0" y="693.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">e forme</text><path d="M205 540 L410 810" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="80" y="687" width="250" height="27" rx="9" fill="#f3eddf"/><text x="205" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">pone il rapporto con Dio</text><path d="M615 725 L410 810" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="475" y="757" width="250" height="27" rx="9" fill="#f3eddf"/><text x="600" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">pone il desiderio umano</text><rect x="170" y="810" width="480" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="869.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Jacopo: Dio e donna nel paradiso</text><path d="M410 915 L410 990" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="939.5" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="958.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">prepara un problema per</text><rect x="170" y="990" width="480" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="1049.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Stilnovo: risposte anche divergenti</text><text x="410" y="1136" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text></svg>