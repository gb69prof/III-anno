<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1280" role="img" aria-labelledby="t d"><title id="t">Come cambia l’amore antico nel Medioevo</title><desc id="d">Amore: eredità e trasformazione parte da Antichità: passione, bellezza, affetti. Antichità: passione, bellezza, affetti viene trasmessa attraverso Classici conservati e riletti. Classici conservati e riletti entra in relazione con Cristianesimo: libertà e salvezza. Cristianesimo: libertà e salvezza orienta il giudizio sul Desiderio interrogato, non cancellato. Desiderio interrogato, non cancellato si rielabora anche nella Corte: misura e perfezionamento. Corte: misura e perfezionamento rende possibili Nuove parole, nuovi conflitti.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#916c3c"/></marker></defs><rect width="820" height="1280" fill="#f3eddf"/><text x="48" y="46" fill="#803e43" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">GBPROF · IL NESSO, PRIMA DEL NOME</text><rect x="100" y="80" width="620" height="105" rx="14" fill="#192d36" stroke="#c3ae8c"/><text x="410.0" y="139.5" text-anchor="middle" fill="#fffcf5" font-family="Arial,sans-serif" font-size="21">Amore: eredità e trasformazione</text><path d="M410 185 L410 245" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="202" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">parte da</text><rect x="100" y="245" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="304.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Antichità: passione, bellezza, affetti</text><path d="M410 350 L410 410" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="367" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">viene trasmessa attraverso</text><rect x="100" y="410" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="469.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Classici conservati e riletti</text><path d="M410 515 L410 575" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="532" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">entra in relazione con</text><rect x="100" y="575" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="634.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Cristianesimo: libertà e salvezza</text><path d="M410 680 L410 740" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="697" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="716" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">orienta il giudizio sul</text><rect x="100" y="740" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="799.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Desiderio interrogato, non cancellato</text><path d="M410 845 L410 905" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="862" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="881" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">si rielabora anche nella</text><rect x="100" y="905" width="620" height="105" rx="14" fill="#fffcf5" stroke="#c3ae8c"/><text x="410.0" y="964.5" text-anchor="middle" fill="#192d36" font-family="Arial,sans-serif" font-size="21">Corte: misura e perfezionamento</text><path d="M410 1010 L410 1070" stroke="#916c3c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="285.0" y="1027" width="250" height="27" rx="9" fill="#f3eddf"/><text x="410.0" y="1046" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#803e43">rende possibili</text><rect x="100" y="1070" width="620" height="105" rx="14" fill="#803e43" stroke="#c3ae8c"/><text x="410.0" y="1129.5" text-anchor="middle" fill="#fff9ee" font-family="Arial,sans-serif" font-size="21">Nuove parole, nuovi conflitti</text><text x="410" y="1256" text-anchor="middle" fill="#586266" font-family="Arial,sans-serif" font-size="14">Amor sacro e amor profano · mappa originale</text></svg>