<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Da Tasso al Barocco</title>
<desc id="desc">Il corpo rende percepibile il rapporto con lo spirito. Mappa concettuale con relazioni esplicite.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#ab813b"/></marker></defs>
<rect width="1200" height="960" fill="#f6f0e4"/>
<rect x="0" y="0" width="1200" height="8" fill="#bd944f"/>
<text x="600" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#172b45">Da Tasso al Barocco</text>
<text x="600" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#49596a">Il corpo rende percepibile il rapporto con lo spirito</text>
<path d="M600,247 L600,278 L215,278 L215,351" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="57" y="284" width="316" height="30" fill="#f6f0e4"/>
<text x="215" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">considera la tragedia di</text>
<path d="M215,512 L215,696" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="55" y="571" width="320" height="34" fill="#f6f0e4"/>
<text x="215" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">si conclude con</text>
<path d="M600,247 L600,278 L600,278 L600,351" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="442" y="284" width="316" height="30" fill="#f6f0e4"/>
<text x="600" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">considera la visione di</text>
<path d="M600,512 L600,696" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="440" y="571" width="320" height="34" fill="#f6f0e4"/>
<text x="600" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">rappresenta la</text>
<path d="M600,247 L600,278 L985,278 L985,351" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="827" y="284" width="316" height="30" fill="#f6f0e4"/>
<text x="985" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">permette di riconoscere</text>
<path d="M985,512 L985,696" fill="none" stroke="#ab813b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="825" y="571" width="320" height="34" fill="#f6f0e4"/>
<text x="985" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#715324">aiuta a leggere</text>
<rect x="420" y="112" width="360" height="135" rx="18" fill="#172b45" stroke="#bd944f" stroke-width="2"/>
<text x="600.0" y="156.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#ffffff">Un confronto, due forme</text>
<text x="600.0" y="196.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#e5cfaa">Tasso e Bernini: analogie e</text>
<text x="600.0" y="222.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#e5cfaa">differenze</text>
<rect x="50" y="357" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="215.0" y="411.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Tasso · canto XII</text>
<text x="215.0" y="451.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">La ferita di Clorinda è reale</text>
<text x="215.0" y="477.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">e mortale</text>
<rect x="435" y="357" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="600.0" y="411.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Bernini · 1647–1652</text>
<text x="600.0" y="451.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">L’Estasi di santa Teresa</text>
<text x="600.0" y="477.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">nella cappella Cornaro</text>
<rect x="820" y="357" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="985.0" y="411.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Una chiave comune</text>
<text x="985.0" y="451.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">Il corpo rende visibile</text>
<text x="985.0" y="477.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">l’esperienza spirituale</text>
<rect x="50" y="702" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="215.0" y="756.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Perdono e battesimo</text>
<text x="215.0" y="796.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">La grazia salva l’anima; la</text>
<text x="215.0" y="822.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">violenza non salva</text>
<rect x="435" y="702" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="600.0" y="756.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Transverberazione</text>
<text x="600.0" y="796.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">La ferita mistica è</text>
<text x="600.0" y="822.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">simbolica, non un’uccisione</text>
<rect x="820" y="702" width="330" height="155" rx="18" fill="#fffdf8" stroke="#bd944f" stroke-width="2"/>
<text x="985.0" y="756.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#172b45">Dal conflitto alla scena</text>
<text x="985.0" y="796.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">Nel Barocco il sacro</text>
<text x="985.0" y="822.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#4b5968">coinvolge anche i sensi</text>
<path d="M50,911 H1150" stroke="#d9c6a4"/>
<text x="50" y="940" font-family="Arial,sans-serif" font-size="16" fill="#596676">TASSO · Percorso di letteratura · gbprof</text>
<text x="1150" y="940" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#596676">Leggi i legami fra i concetti</text>
</svg>